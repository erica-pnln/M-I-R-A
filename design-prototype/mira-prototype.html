html:root:root{--bg:#2C2475;--navy:#1F1A5A;--deep:#2C2475;--ink:#fff;--muted:rgba(255,255,255,.72);--line:rgba(255,255,255,.2);--cyan:#FF5D8F;--card:rgba(255,255,255,.08);--glass:rgba(255,255,255,.08);--glassb:rgba(31,26,90,.55)}
html,html[data-theme]{background:linear-gradient(170deg,#4A3BAA 0%,#33298A 45%,#221C63 100%) fixed !important}
body::before{background:radial-gradient(circle 85px at 91% 9%,#FFA050 0,#FF4F93 68%,#C03BFF 82px,transparent 85.5px),radial-gradient(circle 56px at 5% 60%,#D08AFF 0,#7B4DFF 52px,transparent 56.5px),radial-gradient(circle 62px at 7% 14%,transparent 34px,#FF9A4D 35px,#FF5D8F 60px,transparent 62.5px),radial-gradient(circle 74px at 94% 88%,#FFB36B 0,#FF4F93 68px,transparent 74.5px),radial-gradient(circle 46px at 62% 70%,#B061FF 0,#7B4DFF 42px,transparent 46.5px)}
nav,.card,.panel,.hero,.glass{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2);box-shadow:0 14px 34px rgba(10,5,50,.35)}
nav{background:rgba(31,26,90,.55);box-shadow:none}
.card p,.meta,.note,.hero p,.card h3,.article p,.article h1,.tab,.sec button{text-shadow:none}
.logo i{background:linear-gradient(135deg,#FF9A4D,#FF3D8B)}
.hero h1{font-weight:700}
.hero p{color:rgba(255,255,255,.8)}
.search input,.ask input{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.22)}
.tab.on{background:rgba(255,255,255,.12);box-shadow:inset 0 0 0 1px rgba(255,255,255,.3)}
.badge{background:rgba(255,93,143,.25);color:#FFB8D0}
.chip{background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.2)}
.chip.on{background:linear-gradient(135deg,#FF8A3D,#FF3D8B);border-color:transparent;color:#fff}
.sec{border-bottom-color:rgba(255,255,255,.18)}
.sec button.on{border-color:#FF5D8F}
.btn{background:linear-gradient(135deg,#FF8A3D,#FF3D8B);color:#fff}
.btn.ghost{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.25)}
.card:hover{border-color:rgba(255,150,130,.85);box-shadow:0 14px 34px rgba(10,5,50,.45)}
.card p,.meta{color:rgba(255,255,255,.75)}
.stated{background:rgba(255,255,255,.06);border-left-color:#FF8A3D}
.ai{background:rgba(155,92,246,.25);border-left-color:#D08AFF}
.m.u{background:linear-gradient(135deg,rgba(255,138,61,.5),rgba(255,61,139,.5));border-color:rgba(255,255,255,.3)}
.m.a{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.2)}
.sug button{background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.25)}
.sug button:hover{border-color:#FF5D8F}
.lbl{color:#FFB8D0}
</style>
</head>
<body>
<nav>
 <div class="logo"><i></i>MIRA</div>
 <button class="tab on" data-v="dashboard">Dashboard</button>
 <button class="tab" data-v="chat">MIRA AI Chat</button>
 <button class="tab" data-v="saved">Saved <span id="sc">(0)</span></button>
</nav>
<main id="app"></main>
<script>
const SECTIONS=["Local & Regional","Philippine National","International","Trending"];
const INTERESTS=["Photojournalism","Sports","Mobile journalism","Media Arts","Campus journalism"];
// Prototype sample data: placeholder entries only, not real news.
const ARTICLES=[
{id:1,sec:0,src:"Philippine News Agency",topic:"Campus journalism",t:"Sample story: Regional council reviews a local ordinance",d:"Placeholder summary standing in for an RSS description from a regional publisher."},
{id:2,sec:0,src:"Philippine Information Agency",topic:"Mobile journalism",t:"Sample story: Community groups hold a public consultation",d:"Placeholder summary. In production, this comes from a publisher feed."},
{id:3,sec:1,src:"Rappler",topic:"Media Arts",t:"Sample story: National agency announces a new program",d:"Placeholder summary for a national-level article card."},
{id:4,sec:1,src:"Philippine Daily Inquirer",topic:"Sports",t:"Sample story: Athletes prepare for an upcoming national meet",d:"Placeholder summary for a sports article card."},
{id:5,sec:2,src:"Reuters",topic:"Photojournalism",t:"Sample story: International summit draws regional attention",d:"Placeholder summary for a global story relevant to the Philippines."},
{id:6,sec:2,src:"BBC News",topic:"Media Arts",t:"Sample story: Global media outlets adopt new editorial tools",d:"Placeholder summary for an international article card."},
{id:7,sec:3,src:"GDELT Project",topic:"Mobile journalism",t:"Sample trend: A topic gaining coverage across publishers",d:"Placeholder trend card. Real trends would be derived from GDELT data."},
{id:8,sec:3,src:"GMA Integrated News",topic:"Campus journalism",t:"Sample story: Students launch a campus reporting initiative",d:"Placeholder summary for a campus journalism story."}];
const st={v:"dashboard",sec:0,ints:new Set(),q:"",saved:new Set(),cur:null,chat:[{r:"a",t:"Hi, I’m MIRA. Ask me about current events, journalism research, or media topics. This prototype uses sample replies; the Gemini connection comes later."}],story:{}};
const $=s=>document.querySelector(s),app=$("#app");
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function card(a){return `<div class="card"><div class="meta"><span>${esc(a.src)}</span><span class="badge">SAMPLE</span></div>
<h3 data-open="${a.id}">${esc(a.t)}</h3><p>${esc(a.d)}</p>
<div class="meta"><span>${esc(a.topic)}</span></div>
<div class="row"><button class="btn" data-open="${a.id}">Ask this story</button><button class="btn ghost" data-save="${a.id}">${st.saved.has(a.id)?"Saved ✓":"Save"}</button></div></div>`}
function dash(){
 let list=ARTICLES.filter(a=>a.sec===st.sec);
 if(st.ints.size)list=list.filter(a=>st.ints.has(a.topic));
 if(st.q)list=ARTICLES.filter(a=>(a.t+a.d+a.src).toLowerCase().includes(st.q.toLowerCase()));
 return `<section class="hero"><h1>Go Beyond the Headline.</h1><p>Philippine-focused, globally aware news discovery and research for journalists.</p>
 <div class="search"><input id="q" placeholder="Search stories, topics, sources…" value="${esc(st.q)}"><button class="btn" id="go">Search</button></div></section>
 <div class="chips">${INTERESTS.map(i=>`<button class="chip ${st.ints.has(i)?"on":""}" data-int="${i}">${i}</button>`).join("")}</div>
 <div class="sec">${SECTIONS.map((s,i)=>`<button class="${i===st.sec&&!st.q?"on":""}" data-sec="${i}">${s}</button>`).join("")}</div>
 <div class="grid">${list.map(card).join("")||'<div class="empty">No stories match these filters.</div>'}</div>
 <p class="note">Prototype: all stories are labelled placeholders. No real articles or statistics are shown.</p>`}
function story(){
 const a=ARTICLES.find(x=>x.id===st.cur);const log=st.story[a.id]||[];
 return `<button class="btn ghost" data-v="dashboard">← Back</button><br><br><div class="story"><article class="panel article">
 <div class="meta"><span>${esc(a.src)}</span><span class="badge">SAMPLE</span></div><h1>${esc(a.t)}</h1><p>${esc(a.d)}</p>
 <p>This area would show the article preview and a link to the original publisher. MIRA links out to the source rather than republishing full text.</p>
 <h3 style="margin-top:20px">AI News Analysis</h3>
 <div class="col2"><div class="stated"><span class="lbl">What the article states</span>Main issue, key points, people and organizations, and locations extracted from the article text.</div>
 <div class="ai"><span class="lbl">AI interpretation</span>Background, possible implications, other perspectives, and reporting angles, labelled as AI-generated.</div></div>
 <h3 style="margin-top:20px">Verification checklist</h3>
 <ul class="chk"><li>Which claims are unsupported or disputed?</li><li>Compare coverage from at least two other publishers.</li><li>Find primary documents or official statements.</li></ul>
 <p style="font-size:13px;color:var(--muted)">AI assistance is not a guarantee that a claim is true. The journalist makes the final judgment.</p></article>
 <aside class="glass"><h3>Ask This Story</h3>
 <div class="sug">${["What does this mean?","Who is involved?","What happened before?","Suggest interview questions"].map(s=>`<button data-sug="${s}">${s}</button>`).join("")}</div>
 <div class="msgs" id="sm">${log.map(m=>`<div class="m ${m.r}">${esc(m.t)}</div>`).join("")||'<div class="m a">Ask about this article. Answers start from the article and name any extra sources.</div>'}</div>
 <div class="ask"><input id="si" placeholder="Ask about this story…"><button class="btn" id="ss">Send</button></div></aside></div>`}
function chat(){return `<section class="panel" style="max-width:720px;margin:0 auto"><h2>MIRA AI Chat</h2><p style="color:var(--muted)">General research assistant for current events, journalism, and media.</p>
 <div class="msgs" id="cm" style="max-height:420px">${st.chat.map(m=>`<div class="m ${m.r}">${esc(m.t)}</div>`).join("")}</div>
 <div class="ask"><input id="ci" placeholder="Ask MIRA anything about news or research…"><button class="btn" id="cs">Send</button></div></section>`}
function saved(){const l=ARTICLES.filter(a=>st.saved.has(a.id));return `<h2>Saved articles</h2><br><div class="grid">${l.map(card).join("")||'<div class="empty">Nothing saved yet. Reading history and past conversations will also live here once Supabase is connected.</div>'}</div>`}
function reply(q){const l=q.toLowerCase();
 if(l.includes("interview"))return "Sample reply: consider asking affected residents, a local official, and a subject expert. Ask what changed, who is affected, and what evidence supports each claim.";
 if(l.includes("who"))return "Sample reply: in the live version I would list the people and organizations named in the article and mark any I add from other sources.";
 if(l.includes("before")||l.includes("background"))return "Sample reply: I would summarize earlier coverage with source links so you can verify the timeline yourself.";
 return "Sample reply: this is a prototype response. With the Gemini API connected, I would answer using the article or your question, cite sources, and flag unverified claims."}
function render(){
 document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("on",t.dataset.v===st.v||(st.v==="story"&&t.dataset.v==="dashboard")));
 $("#sc").textContent=`(${st.saved.size})`;
 app.innerHTML=st.v==="dashboard"?dash():st.v==="story"?story():st.v==="chat"?chat():saved();
 const q=$("#q");if(q){q.onkeydown=e=>{if(e.key==="Enter"){st.q=q.value;render()}};$("#go").onclick=()=>{st.q=q.value;render()}}
 const s=$("#ss");if(s){const send=t=>{if(!t.trim())return;const a=st.cur;(st.story[a]=st.story[a]||[]).push({r:"u",t},{r:"a",t:reply(t)});render()};s.onclick=()=>send($("#si").value);$("#si").onkeydown=e=>{if(e.key==="Enter")send(e.target.value)};document.querySelectorAll("[data-sug]").forEach(b=>b.onclick=()=>send(b.dataset.sug))}
 const c=$("#cs");if(c){const send=t=>{if(!t.trim())return;st.chat.push({r:"u",t},{r:"a",t:reply(t)});render();$("#ci").focus()};c.onclick=()=>send($("#ci").value);$("#ci").onkeydown=e=>{if(e.key==="Enter")send(e.target.value)}}
 ["sm","cm"].forEach(i=>{const e=document.getElementById(i);if(e)e.scrollTop=e.scrollHeight});
}
document.addEventListener("click",e=>{const t=e.target.closest("[data-v],[data-open],[data-save],[data-int],[data-sec]");if(!t)return;
 const d=t.dataset;
 if(d.v){st.v=d.v;if(d.v==="dashboard")st.q="";location.hash=d.v}
 else if(d.open){st.cur=+d.open;st.v="story";location.hash="story";scrollTo(0,0)}
 else if(d.save){const i=+d.save;st.saved.has(i)?st.saved.delete(i):st.saved.add(i)}
 else if(d.int){st.ints.has(d.int)?st.ints.delete(d.int):st.ints.add(d.int);st.q=""}
 else if(d.sec){st.sec=+d.sec;st.q=""}
 render()});
addEventListener("hashchange",()=>{const h=location.hash.slice(1);if(["dashboard","chat","saved"].includes(h)){st.v=h;render()}});
render();
</script>
</body>
</html>
